# AI Job Hunter (自动求职智能体) 配置文件示例
# 复制本文件为 config.toml 并按需修改

[search]
# 检索意向岗位关键词
keywords = ["Python", "AI应用开发", "自动化", "爬虫"]
# 意向城市
cities = ["全国", "远程"]
# 期望薪资下限 (K)
salary_floor = 8

[browser]
# Chrome CDP 调试端口（若被占用会自动寻找可用端口）
port = 9222
# 用户数据目录路径（存放独立登录态缓存，留空则自动使用系统标准独立数据空间）
user_data_dir = "chrome-profile"
# Chrome 可执行文件路径（留空则自动探测当前操作系统与安装路径）
exe = ""

[features]
# 是否开启自动同意 HR 发起的简历附件请求（默认 false，开启后仅在安全校验全部通过时自动同意）
auto_accept_resume = false

[llm]
# 物理级防偷跑机制：默认关闭外部计费调用，全流程优先走本地规则
enabled = false
allow_paid_api = false
provider = "local_rule"
base_url = "http://127.0.0.1:11434/v1"
model = "rule-fallback"
timeout = 60
max_output_tokens = 1500

[paths]
db = "jobs.sqlite"
dump = "dump"
report = "report.md"
